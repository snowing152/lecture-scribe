[audio]
device = "auto"          # "auto" = monitor of the current output device
sample_rate = 16000
silence_rms = 0.001      # blocks quieter than this count as silence

[asr]
model = "large-v3"
gpu = false
language = "ko"          # "en" for English; the window starts on this one
beam_size = 5
hotwords = ""            # terms of the course, e.g. "TCP 혼잡 제어 슬라이딩 윈도우"

[output]
dir = "~/lectures"
paragraph_gap = 1.2      # seconds of pause that break a paragraph
paragraph_target = 90    # ... and past this long, break at the next sentence
paragraph_max = 180      # ... and past this long, break at the next segment

# Models the window offers in its Model list, each by a short name that
# `asr.model` and `scribe text --model` accept too. `model` is a
# faster-whisper name or a directory holding a converted model.
[models.large-v3]
model = "large-v3"
note = "default; most tested here"

# A Korean fine-tune of large-v3, converted once; see the README.
# [models.buzz-korean]
# model = "~/.cache/lecture-scribe/models/buzz-korean"
# note = "Korean-tuned; more speech, English terms kept; ~1.7x slower"
