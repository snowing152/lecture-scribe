[project]
name = "lecture-scribe"
version = "0.1.0"
description = "Offline capture and transcription of Korean lectures from system audio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "soundcard>=0.4.3",
    "soundfile>=0.13",
    "numpy>=2.0",
    "faster-whisper>=1.1",
    "pyside6-essentials>=6.8",
]

[project.scripts]
scribe = "lecture_scribe.cli:main"

# A gui-script gets no console window attached to it on Windows.
[project.gui-scripts]
scribe-gui = "lecture_scribe.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lecture_scribe"]

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8.3", "ruff>=0.9"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",        # pyflakes
    "E", "W",   # pycodestyle
    "I",        # import order
    "N",        # naming
    "D",        # docstrings
    "UP",       # pyupgrade
    "ANN",      # missing annotations
    "B",        # bugbear
    "A",        # shadowed builtins
    "C4",       # comprehensions
    "SIM",      # simplifications
    "PTH",      # os.path -> pathlib
    "BLE",      # blind except
    "ARG",      # unused arguments
    "TID",      # tidy imports
    "RUF",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]
# The [output] section of config.toml is spelled `dir`; the field name follows it.
"src/lecture_scribe/config.py" = ["A003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["soundcard.*", "soundfile.*", "faster_whisper.*", "ctranslate2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not manual'"
markers = [
    "manual: needs real audio hardware or a downloaded ASR model; run with -m manual",
]
