name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One system failing should not hide what the other says.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # The window tests draw on Qt's offscreen platform, so no display is needed.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      # Libraries Qt itself loads, which a bare runner lacks. If the first run
      # still names one missing, add it here rather than skipping the tests.
      - name: System libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # No `--extra cuda`: a runner has no GPU and the wheel costs a gigabyte.
      - run: uv sync --locked

      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
